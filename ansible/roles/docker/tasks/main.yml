---
- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present
    update_cache: yes

- name: Add ec2-user and jenkins to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop:
    - ec2-user
    - jenkins

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
