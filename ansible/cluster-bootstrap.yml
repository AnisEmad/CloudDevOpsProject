---
- name: Bootstrap EKS add-ons (NGINX Ingress + ArgoCD + GitOps app)
  hosts: localhost
  connection: local
  vars:
    aws_region: us-east-1
    cluster_name: ivolve-eks-cluster
    repo_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Update kubeconfig for EKS
      ansible.builtin.command:
        cmd: aws eks update-kubeconfig --name {{ cluster_name }} --region {{ aws_region }}
      changed_when: false

    - name: Add NGINX Ingress Helm repository
      ansible.builtin.command:
        cmd: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      failed_when: false 
      changed_when: false
    
    - name: Add ArgoCD Helm repository
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      failed_when: false
      changed_when: false

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Install NGINX Ingress Controller (Helm)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
          --namespace ingress-nginx --create-namespace --wait --timeout 5m
      changed_when: false

    - name: Install ArgoCD (Helm)
      ansible.builtin.command:
        cmd: >
          helm upgrade --install argocd argo/argo-cd
          --namespace argocd --create-namespace --wait --timeout 5m
      changed_when: false

    - name: Expose ArgoCD UI via LoadBalancer
      ansible.builtin.command:
        cmd: kubectl patch svc argocd-server -n argocd -p '{"spec":{"type":"LoadBalancer"}}'
      changed_when: false

    - name: Deploy the GitOps application (ArgoCD syncs everything else)
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/argocd/application.yaml
      changed_when: false