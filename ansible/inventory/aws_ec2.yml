plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

filters:
  tag:Name: "*jenkins*"
  instance-state-name: ["running"]

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_aws_ssm_region: "'us-east-1'"
  ansible_aws_ssm_bucket_name: "'ivolve-final-ansible-ssm-transfer'"

keyed_groups:
  - key: tags.Name
    prefix: tag_name
